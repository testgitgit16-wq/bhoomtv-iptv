<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>BhoomTV Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>BhoomTV Capture</h1>
  <p class="hint">Play a BhoomTV channel. Captured .m3u8/.mpd requests appear here automatically.</p>
  <div class="toolbar">
    <button id="refresh">Refresh</button>
    <button id="copy">Copy M3U</button>
    <button id="download">Download M3U</button>
    <button id="json">Download JSON</button>
    <button id="clear" class="danger">Clear</button>
  </div>
  <div id="status"></div>
  <div id="items"></div>
  <script src="popup.js"></script>
</body>
</html>
